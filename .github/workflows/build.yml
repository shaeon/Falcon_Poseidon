# Compila el Falcon030 para Poseidon en GitHub con Quartus 17.0 (imagen Docker
# raetro/quartus:17.0) y deja como resultado el .rbf y los informes. Al subir
# una etiqueta v* (por ejemplo v1.0) crea ademas una Release con el .rbf.
#
# - push / pull request: compila y sube el resultado (pestana Actions).
# - Lanzar a mano: Actions > Build > Run workflow.
# - Release: git tag v1.0 && git push origin v1.0
#
# Quartus se ejecuta con el usuario de la maquina de GitHub, no como root.
# Las acciones van con Node.js 24 (checkout y upload-artifact v5; el resto se
# fuerza con FORCE_JAVASCRIPT_ACTIONS_TO_NODE24).

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'tb/**'
      - 'releases/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tb/**'
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write          # para crear la Release en las etiquetas v*

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # La imagen de Quartus ocupa unos 6 GB comprimida: se libera sitio antes
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Falcon_MiSTer (con AP68030 dentro) y common/mist-modules son submodulos
      - name: Descargar el repositorio con los submodulos
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Descargar Quartus 17.0
        run: docker pull raetro/quartus:17.0

      # Compilacion completa: common/build_id.tcl (build_id.v y tablas .mem),
      # sintesis, ajuste, ensamblado (con el .rbf) y tiempos
      - name: Compilar
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e QUARTUS_64BIT=1 \
            -v "$GITHUB_WORKSPACE":/build -w /build/poseidon raetro/quartus:17.0 \
            quartus_sh --flow compile falcon_poseidon

      # Recursos y tiempos en la pagina de la ejecucion; aviso si alguna
      # holgura es negativa (no para la compilacion: el .rbf sale igual)
      - name: Resumen
        if: always()
        run: |
          OUT=poseidon/output_files/falcon_poseidon
          {
            echo "## Falcon030 Poseidon (Quartus 17.0)"
            if [ -f "$OUT.fit.summary" ]; then
              echo '```'
              grep -E 'Fitter Status|Device|Total logic elements|Total memory bits|Total PLLs' "$OUT.fit.summary"
              echo '```'
            fi
            if [ -f "$OUT.sta.rpt" ]; then
              echo '```'
              for s in "Setup Summary" "Hold Summary"; do
                echo "== $s"
                sed -n "/; Slow 1200mV 85C Model $s/,/^$/p" "$OUT.sta.rpt" | grep '^; [^C-]' | grep -v 'Clock *;' | cut -c1-110
              done
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$OUT.sta.rpt" ] && sed -n '/Setup Summary/,/Removal Summary/p' "$OUT.sta.rpt" | grep -qE ';[[:space:]]*-[0-9]+\.[0-9]+[[:space:]]*;'; then
            echo "::warning title=Tiempos::Hay holguras negativas: revisa falcon_poseidon.sta.rpt"
          fi

      - name: Preparar el resultado
        if: always()
        run: |
          mkdir -p dist
          DATE=$(date -u +%Y%m%d)
          OUT=poseidon/output_files/falcon_poseidon
          [ -f "$OUT.rbf" ] && cp "$OUT.rbf" "dist/Falcon_poseidon_${DATE}.rbf"
          for r in map fit sta flow asm; do
            [ -f "$OUT.$r.rpt" ] && cp "$OUT.$r.rpt" dist/
          done
          ls -la dist

      - name: Subir el resultado
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Falcon_poseidon-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Crear la Release (etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Falcon_poseidon_*.rbf
          generate_release_notes: true
